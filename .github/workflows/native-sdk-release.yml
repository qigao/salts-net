name: SaltsNet native SDK package

on:
  pull_request:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "cmake/**"
      - "ice/**"
      - "snmp/**"
      - "ldap/**"
      - "email/**"
      - "lb/**"
      - "tproxy/**"
      - "internal/**"
      - "tools/**"
      - "vcpkg.json"
      - "packaging/nuget/**"
      - ".github/workflows/**"
      - "tests/**"
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - ".github/workflows/**"
      - "packaging/nuget/**"
      - "cmake/**"
      - "CMakeUserPresets.json"
      - "tests/**"
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Build the exact release version without publishing or creating a tag
        type: boolean
        default: false
      publish_from_run:
        description: Successful preparation run ID to publish unchanged (dispatch on its matching tag)
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: saltsnet-native-sdk-${{ github.event.pull_request.number || github.ref }}-${{ inputs.publish_from_run && 'publish' || inputs.prepare_release && 'prepare' || 'qualify' }}
  cancel-in-progress: ${{ !inputs.publish_from_run }}

jobs:
  metadata:
    if: github.event_name == 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_version: ${{ steps.meta.outputs.source_version }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      qualify: ${{ steps.meta.outputs.qualify }}
      artifact_run_id: ${{ steps.meta.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARE_RELEASE: ${{ inputs.prepare_release }}
          PUBLISH_FROM_RUN: ${{ inputs.publish_from_run }}
        run: |
          set -euo pipefail
          cmake_version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          source_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["version-semver"])')"
          # CMake project VERSION is numeric; vcpkg owns the full release SemVer.
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          test "$cmake_version" = "${source_version%%-*}"
          tag="v$source_version"
          source_commit="$(git rev-parse HEAD)"
          publish=false
          qualify=true
          artifact_run_id="$GITHUB_RUN_ID"
          if [[ -n "$PUBLISH_FROM_RUN" ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$PREPARE_RELEASE" != true
            [[ "$PUBLISH_FROM_RUN" =~ ^[1-9][0-9]*$ ]]
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "$tag"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_FROM_RUN" > "$RUNNER_TEMP/prepared-run.json"
            jq -e --arg sha "$source_commit" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .repository.full_name == $repo and
              .event == "workflow_dispatch" and .status == "completed" and
              .conclusion == "success" and
              .path == ".github/workflows/native-sdk-release.yml"
            ' "$RUNNER_TEMP/prepared-run.json" >/dev/null
            version="$source_version"
            artifact_run_id="$PUBLISH_FROM_RUN"
            qualify=false
            publish=true
          elif [[ "$PREPARE_RELEASE" == true ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            version="$source_version"
          elif [[ "$source_version" == *-rc.* && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            # RC publication is explicit and consumes a successful preparation.
            version="$source_version"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
            version="$source_version"
            publish=true
          elif [[ "$GITHUB_REF" == "refs/heads/master" && ( "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "push" ) ]]; then
            version="$source_version"
            remote_tag_sha="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ -n "$remote_tag_sha" ]]; then
              if GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                publish=false
                qualify=false
                version="$source_version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
              else
                peeled_tag_sha="$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')"
                if [[ -n "$peeled_tag_sha" ]]; then
                  remote_tag_sha="$peeled_tag_sha"
                fi
                test "$remote_tag_sha" = "$source_commit"
                publish=true
              fi
            else
              publish=true
            fi
          else
            version="$source_version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "qualify=$qualify" >> "$GITHUB_OUTPUT"
          echo "artifact_run_id=$artifact_run_id" >> "$GITHUB_OUTPUT"

  native:
    needs: metadata
    if: needs.metadata.outputs.qualify == 'true'
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    secrets: inherit

  pack:
    name: Pack SaltsNet.Native
    needs: [metadata, native]
    if: needs.metadata.outputs.qualify == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: saltsnet-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/SaltsNet/SaltsNetConfig.cmake
          test -f package/sdk/windows-x64/lib/cmake/SaltsNet/SaltsNetConfig.cmake
          test -f package/sdk/android-arm64-v8a/lib/cmake/SaltsNet/SaltsNetConfig.cmake
          test -f package/sdk/ios-arm64/lib/cmake/SaltsNet/SaltsNetConfig.cmake
          test -f package/sdk/linux-arm64/lib/cmake/SaltsNet/SaltsNetConfig.cmake
          mac_config="$(find package/sdk -path '*macos-*/lib/cmake/SaltsNet/SaltsNetConfig.cmake' -print -quit)"
          test -n "$mac_config"
          test "$(find package/sdk -maxdepth 2 -name saltsnet-sdk-manifest.txt | wc -l)" -eq 6
          mapfile -t salts_versions < <(
            sed -n 's/^salts=//p' package/sdk/*/saltsnet-sdk-manifest.txt | tr -d '\r' | sort -u
          )
          test "${#salts_versions[@]}" -eq 1
          mapfile -t salts_utils_versions < <(
            sed -n 's/^salts_utils=//p' package/sdk/*/saltsnet-sdk-manifest.txt | tr -d '\r' | sort -u
          )
          test "${#salts_utils_versions[@]}" -eq 1
          test "$(grep -l '^salts_utils=' package/sdk/*/saltsnet-sdk-manifest.txt | wc -l)" -eq 6
          [[ "${salts_versions[0]}" == 2.3.0 || "${salts_versions[0]}" =~ ^2\.3\.0-rc\.[0-9]+$ ]]
          [[ "${salts_utils_versions[0]}" == 4.3.0 || "${salts_utils_versions[0]}" =~ ^4\.3\.0-rc\.[0-9]+$ ]]
          echo "SALTS_PACKAGE_VERSION=${salts_versions[0]}" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_PACKAGE_VERSION=${salts_utils_versions[0]}" >> "$GITHUB_ENV"
          du -sh package/sdk
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Configure GitHub Packages source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/saltsnet-pack.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          echo "SALTSNET_PACK_NUGET_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Create NuGet package
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/SaltsNet.Native.csproj \
            --configfile "$SALTSNET_PACK_NUGET_CONFIG" --no-cache --force-evaluate \
            -p:SaltsNativeQualifiedVersion="$SALTS_PACKAGE_VERSION" \
            -p:SaltsUtilsNativeQualifiedVersion="$SALTS_UTILS_PACKAGE_VERSION"
          dotnet pack packaging/nuget/SaltsNet.Native.csproj --configuration Release --output dist --no-restore \
            -p:PackageVersion=${{ needs.metadata.outputs.version }} \
            -p:PackageRoot="$GITHUB_WORKSPACE/package" \
            -p:RepositoryCommit=${{ needs.metadata.outputs.source_commit }} \
            -p:SaltsNativeQualifiedVersion="$SALTS_PACKAGE_VERSION" \
            -p:SaltsUtilsNativeQualifiedVersion="$SALTS_UTILS_PACKAGE_VERSION"
          test -f "dist/SaltsNet.Native.${{ needs.metadata.outputs.version }}.nupkg"
          unzip -p "dist/SaltsNet.Native.${{ needs.metadata.outputs.version }}.nupkg" "SaltsNet.Native.nuspec" > "$RUNNER_TEMP/saltsnet.nuspec"
          if grep -E 'id="(Salts.Native|SaltsUtils.Native)"' "$RUNNER_TEMP/saltsnet.nuspec"; then
            echo "SaltsNet.Native must not embed GitHub package dependency metadata" >&2
            exit 1
          fi
          python3 cmake/ci/verify-release-package.py \
            "dist/SaltsNet.Native.${{ needs.metadata.outputs.version }}.nupkg" \
            "${{ needs.metadata.outputs.version }}" "${{ needs.metadata.outputs.source_commit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: saltsnet-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    needs: [metadata, pack]
    if: >-
      always() && !cancelled() && needs.metadata.result == 'success' &&
      needs.metadata.outputs.publish == 'true' &&
      (needs.pack.result == 'success' ||
       (needs.metadata.outputs.qualify == 'false' && needs.pack.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: saltsnet-native-nuget
          path: dist
          run-id: ${{ needs.metadata.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify prepared package provenance
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.source_version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        shell: bash
        run: python3 cmake/ci/verify-release-package.py "dist/SaltsNet.Native.$PACKAGE_VERSION.nupkg" "$PACKAGE_VERSION" "$SOURCE_COMMIT"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Ensure immutable release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null)"; then
            test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
            remote_commit="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"
            test "${remote_commit:-$existing}" = "$SOURCE_COMMIT"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$SOURCE_COMMIT"
          fi
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text
          # A duplicate requires inspection; do not silently accept unknown bytes.
          dotnet nuget push "dist/SaltsNet.Native.${{ needs.metadata.outputs.source_version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.source_version }}
        shell: bash
        run: |
          set -euo pipefail
          pkg="dist/SaltsNet.Native.$VERSION.nupkg"
          flags=()
          if [[ "$VERSION" == *-rc.* ]]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            digest="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "SaltsNet.Native.'"$VERSION"'.nupkg") | .digest')"
            if [[ -n "$digest" ]]; then
              test "$digest" = "sha256:$(sha256sum "$pkg" | cut -d ' ' -f 1)"
            else
              gh release upload "$TAG" "$pkg" --repo "$GITHUB_REPOSITORY"
            fi
          else
            notes="docs/releases/$VERSION.md"
            if [[ -f "$notes" ]]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
            gh release create "$TAG" "$pkg" --repo "$GITHUB_REPOSITORY" --verify-tag --title "SaltsNet $VERSION" "${flags[@]}"
          fi
