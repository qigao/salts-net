name: Build and test SaltsNet native SDKs

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
            host: linux-x64
            triplet: x64-linux
            host_triplet: x64-linux
            preset: ci-linux-release-user
            cross: false
          - runner: windows-2025
            rid: windows-x64
            host: windows-x64
            triplet: x64-windows
            host_triplet: x64-windows
            preset: ci-win-release-user
            cross: false
          - runner: macos-15
            rid: macos-arm64
            host: macos-arm64
            triplet: arm64-osx
            host_triplet: arm64-osx
            preset: ci-macos-release-user
            cross: false
          - runner: ubuntu-24.04
            rid: android-arm64-v8a
            host: linux-x64
            triplet: arm64-android
            host_triplet: x64-linux
            preset: ci-android-sdk-release-user
            host_preset: ci-host-release-user
            cross: true
          - runner: macos-15
            rid: ios-arm64
            host: macos-arm64
            triplet: arm64-ios
            host_triplet: arm64-osx
            preset: ci-ios-sdk-release-user
            host_preset: ci-macos-host-release-user
            sysroot: iphoneos
            cross: true
          # Published upstream RC packages ship linux-arm64, not iOS simulator.
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            host: linux-arm64
            triplet: arm64-linux
            host_triplet: arm64-linux
            preset: ci-linux-arm64-release-user
            cross: false
    env:
      QIGAO_SDK_RID: ${{ matrix.rid }}
      QIGAO_TARGET_TRIPLET: ${{ matrix.triplet }}
      QIGAO_HOST_TRIPLET: ${{ matrix.host_triplet }}
      QIGAO_IOS_SYSROOT: ${{ matrix.sysroot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select iOS cache namespace
        if: matrix.preset == 'ci-ios-sdk-release-user'
        shell: bash
        run: echo 'X_VCPKG_NUGET_ID_PREFIX=vcpkg-cache' >> "$GITHUB_ENV"
      - id: vcpkg-cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@fafb1efe5ac2440bfd7a08e493988d0459d89e51
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache resolved NuGet native payloads
        uses: actions/cache@v4
        with:
          path: stage/nuget
          key: saltsnet-nuget-v1-${{ runner.os }}-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            saltsnet-nuget-v1-${{ runner.os }}-${{ matrix.rid }}-
      - name: Prepare Linux tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm perl ccache
      - name: Prepare macOS tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja nasm ccache
      - name: Prepare Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ninja nasm strawberryperl ccache -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Build tool installation failed' }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) { throw 'MSVC x64 toolchain not found' }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          if (-not $env:VCPKG_ROOT -or -not $env:QIGAO_VCPKG_WINDOWS_TRIPLET) { throw 'Shared vcpkg environment is missing' }
          "QIGAO_VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          "QIGAO_TARGET_TRIPLET=$env:QIGAO_VCPKG_WINDOWS_TRIPLET" >> $env:GITHUB_ENV
          "QIGAO_HOST_TRIPLET=$env:QIGAO_VCPKG_WINDOWS_TRIPLET" >> $env:GITHUB_ENV
      - name: Configure ccache for this compiler and ABI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ccache = (Get-Command ccache -ErrorAction Stop).Source
          & $ccache --version
          if ($LASTEXITCODE -ne 0) { throw 'ccache is unavailable' }
          "CCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'saltsnet-ccache')" >> $env:GITHUB_ENV
          "CCACHE_MAXSIZE=512M" >> $env:GITHUB_ENV
          "CCACHE_NODIRECT=true" >> $env:GITHUB_ENV
          "CCACHE_COMPILERCHECK=content" >> $env:GITHUB_ENV
          "CMAKE_C_COMPILER_LAUNCHER=$ccache" >> $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=$ccache" >> $env:GITHUB_ENV
          if ($IsWindows) { "CCACHE_COMPILERTYPE=msvc" >> $env:GITHUB_ENV }
      - name: Restore ccache objects
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/saltsnet-ccache
          key: saltsnet-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rid }}-${{ matrix.triplet }}-${{ steps.vcpkg-cache.outputs.cache_revision }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'CMakeUserPresets.json', 'presets/**', 'CMakeOptions.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            saltsnet-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rid }}-${{ matrix.triplet }}-${{ steps.vcpkg-cache.outputs.cache_revision }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'CMakeUserPresets.json', 'presets/**', 'CMakeOptions.cmake') }}-
      - name: Begin ccache accounting
        shell: pwsh
        run: ccache --zero-stats
      - name: Restore prerelease Salts 2.3, SaltsUtils 4.3 and re2c
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./cmake/ci/restore-native-sdk.ps1 -SaltsRid '${{ matrix.rid }}' -HostRid '${{ matrix.host }}'
      - name: Verify CNet 2.3 strategy SDK and SaltsUtils 4.3 surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            (Join-Path $env:SALTS_ROOT 'include/cnet/client_pool.h'),
            (Join-Path $env:SALTS_ROOT 'include/cnet/destination_policy.h'),
            (Join-Path $env:SALTS_ROOT 'include/cnet/owner_placement.h'),
            (Join-Path $env:SALTS_ROOT 'include/cnet/managed_dial.h'),
            (Join-Path $env:SALTS_ROOT 'include/cnet/recovery_policy.h'),
            (Join-Path $env:SALTS_ROOT 'include/cnet/sg_host.h'),
            (Join-Path $env:SALTS_UTILS_ROOT 'lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake')
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing CNet 2.3 / SaltsUtils 4.3 installed SDK contract: $file"
            }
          }
      - name: Build host tools for cross compilation
        if: matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset '${{ matrix.host_preset }}'
          cmake --build --preset '${{ matrix.host_preset }}' --parallel 2
      - name: Configure and build Unix graph
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset '${{ matrix.preset }}'
          cmake --build --preset '${{ matrix.preset }}' --parallel 2
      - name: Configure and build Windows graph
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --preset "${{ matrix.preset }}"
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
          if errorlevel 1 exit /b 1
      - name: Run Unix tests
        if: runner.os != 'Windows' && !matrix.cross
        shell: bash
        run: ctest --preset '${{ matrix.preset }}' --no-tests=error --output-on-failure --timeout 180 --parallel 2
      - name: Run Windows tests
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 180 --parallel 2
          if errorlevel 1 exit /b 1
      - name: Install Unix SDK
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build --preset 'install-${{ matrix.preset }}' --parallel 2
      - name: Install Windows SDK
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --build --preset "install-${{ matrix.preset }}" --parallel 2
          if errorlevel 1 exit /b 1
      - name: Verify isolated installed SDK consumers (Unix)
        if: runner.os != 'Windows' && !matrix.cross
        shell: pwsh
        run: ./cmake/ci/verify-installed-sdk.ps1
      - name: Verify isolated installed SDK consumers (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          pwsh -NoProfile -File cmake/ci/verify-installed-sdk.ps1
          if errorlevel 1 exit /b 1
      - name: Record SDK provenance
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage/sdk/$env:QIGAO_SDK_RID"
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not read source commit' }
          @("version=$env:PACKAGE_VERSION", "commit=$commit", "rid=$env:QIGAO_SDK_RID",
            "triplet=$env:QIGAO_TARGET_TRIPLET", 'build_type=Release',
            "salts=$env:SALTS_VERSION", "salts_utils=$env:SALTS_UTILS_VERSION", "re2c=$env:RE2C_VERSION") |
            Set-Content -LiteralPath (Join-Path $prefix 'saltsnet-sdk-manifest.txt')
      - name: Report compiler cache results
        if: always()
        shell: pwsh
        run: |
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            ccache --show-stats
          }
      - uses: actions/upload-artifact@v4
        with:
          name: saltsnet-sdk-${{ matrix.rid }}
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-diagnostics-${{ matrix.rid }}
          path: |
            build/ci-sdk/${{ matrix.rid }}/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-sdk/${{ matrix.rid }}/vcpkg-manifest-install.log
            build/ci-sdk/${{ matrix.rid }}/Testing/Temporary
          if-no-files-found: warn
