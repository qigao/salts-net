name: Released SDK contract

on:
  pull_request:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "ice/**"
      - "snmp/**"
      - "ldap/**"
      - "email/**"
      - "lb/**"
      - "tproxy/**"
      - "vcpkg.json"
      - ".github/workflows/released-sdk-contract.yml"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: saltsnet-released-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SALTS_SDK_VERSION: "1.8.3"
  SALTS_UTILS_SDK_VERSION: "4.1.3"

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Restore released Salts ecosystem SDKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/saltsnet-sdk-nuget.config"
          project="$RUNNER_TEMP/saltsnet-sdk-restore.csproj"
          packages="$RUNNER_TEMP/saltsnet-sdk-packages"
          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="[${SALTS_SDK_VERSION}]" />
              <PackageReference Include="SaltsUtils.Native" Version="[${SALTS_UTILS_SDK_VERSION}]" />
            </ItemGroup>
          </Project>
          EOF
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet restore "$project" --configfile "$config" --packages "$packages"
          salts_root="$packages/salts.native/$SALTS_SDK_VERSION/sdk/linux-x64"
          salts_utils_root="$packages/saltsutils.native/$SALTS_UTILS_SDK_VERSION/sdk/linux-x64"
          test -f "$salts_root/lib/cmake/Salts/SaltsConfigVersion.cmake"
          test -f "$salts_utils_root/lib/cmake/SaltsUtils/SaltsUtilsConfigVersion.cmake"
          echo "SALTS_ROOT=$salts_root" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$salts_utils_root" >> "$GITHUB_ENV"

      - name: Restore vcpkg dependencies from shared cache
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/saltsnet-vcpkg-installed"
          log="$RUNNER_TEMP/saltsnet-vcpkg-cache.log"
          rm -rf "$install_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$install_root" \
            --triplet x64-linux \
            --only-binarycaching 2>&1 | tee "$log"
          if grep -q '^Building ' "$log"; then
            echo "shared cache miss detected" >&2
            exit 1
          fi
          echo "SALTSNET_VCPKG_INSTALLED=$install_root" >> "$GITHUB_ENV"

      - name: Configure, build and test against released SDKs
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/released-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$SALTSNET_VCPKG_INSTALLED" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DSALTSNET_ENABLE_LSQUIC=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$SALTSNET_VCPKG_INSTALLED/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake --build build/released-sdk --parallel 2
          ctest --test-dir build/released-sdk --no-tests=error --output-on-failure
